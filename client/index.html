<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_IN">
<meta property="og:site_name" content="CoreTalents">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/logo-header.png" as="image">
<script>
  // Start the first screen's banner image at once instead of after the JS bundle.
  // Keep in sync with HEAD_VIDEO in src/components/Blocks.jsx.
  (function () {
    var p = location.pathname.replace(/\/+$/, '') || '/';
    var map = {
      '/': 'hero-poster', '/services': 'svc-recruitment', '/about': 'svc-recruitment',
      '/roles': 'svc-bulk', '/locations': 'ph-city', '/insights': 'ph-laptop',
      '/how-we-work': 'svc-language', '/contact': 'svc-language', '/empanelment': 'ph-signing'
    };
    if (!map[p]) return;
    var l = document.createElement('link');
    l.rel = 'preload'; l.as = 'image'; l.href = '/video/' + map[p] + '.webp';
    l.setAttribute('fetchpriority', 'high');
    document.head.appendChild(l);
  })();
</script>
<!-- GA4: paste your measurement ID, then uncomment

<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XXXXXXX');</script>

<style>
  /* First-load loader: the logo-reveal clip (public/loader.mp4), then main.jsx flies the logo into the header.
     Inline so it paints before the JS bundle arrives. */
  #preloader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;transition:opacity .45s cubic-bezier(.16,1,.3,1),visibility .45s}
  /* same colour as the clip background, so the clip has no visible edge */
  #preloader .pl-bg{position:absolute;inset:0;background:#fff}
  #preloader .pl-stage{position:relative;width:min(94vw,820px);aspect-ratio:5/2}
  #preloader .pl-video{
    position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .4s;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent),linear-gradient(transparent,#000 8%,#000 92%,transparent);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent),linear-gradient(transparent,#000 8%,#000 92%,transparent);
    mask-composite:intersect;
  }
  /* the real logo, sitting exactly on the logo in the clip's last frame; hidden until it takes over and flies */
  #preloader img{position:absolute;left:16.979%;top:37.169%;width:66.045%;max-width:none;height:auto;opacity:0}
  #preloader.flying{pointer-events:none}
  #preloader.flying img{opacity:1}
  #preloader.flying .pl-video{opacity:0}
  #preloader.done{opacity:0;visibility:hidden;pointer-events:none}
  @media (prefers-reduced-motion:reduce){
    #preloader .pl-video{display:none}
    #preloader img{opacity:1}
  }
</style>
</head>
<body>
<div id="preloader" role="status" aria-label="Loading CoreTalents">
  <div class="pl-bg"></div>
  <div class="pl-stage">
    <video class="pl-video" src="/loader.mp4" poster="/loader-poster.webp" width="1280" height="512" autoplay muted playsinline preload="auto" aria-hidden="true"></video>
    <img src="/logo-header.png" width="875" height="136" alt="">
  </div>
</div>
<script>
  // the admin panel has no loader
  if (location.pathname.indexOf('/admin') === 0) document.getElementById('preloader').remove();
</script>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_IN">
<meta property="og:site_name" content="CoreTalents">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/logo-header.png" as="image">

<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XXXXXXX');</script>

<style>
  /* First-load loader. Inline so it paints before the JS bundle arrives; main.jsx fades it out. */
  #preloader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;transition:opacity .45s cubic-bezier(.16,1,.3,1),visibility .45s}
  #preloader .pl-bg{position:absolute;inset:0;background:#fafbfd}
  #preloader .pl-inner{position:relative}
  #preloader.flying{pointer-events:none}
  #preloader.flying .pl-track{opacity:0;transform:scaleX(.4);transition:opacity .3s,transform .4s}

  #preloader.done{opacity:0;visibility:hidden;pointer-events:none}
  #preloader .pl-inner{display:grid;justify-items:center;gap:22px}
  #preloader img{width:min(260px,64vw);height:auto;animation:pl-breathe 1.8s ease-in-out infinite}
  #preloader .pl-track{position:relative;width:160px;height:4px;border-radius:999px;background:#eaf1f8;overflow:hidden}
  #preloader .pl-track::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:inherit;background:#ffc700;animation:pl-slide 1.1s cubic-bezier(.65,0,.35,1) infinite}
  @keyframes pl-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  @keyframes pl-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  @media (prefers-reduced-motion:reduce){
    #preloader img,#preloader .pl-track::after{animation:none}
    #preloader .pl-track::after{width:100%}
  }
</style>
</head>
<body>
<div id="preloader" role="status" aria-label="Loading CoreTalents">
  <div class="pl-bg"></div>
  <div class="pl-inner">
    <img src="/logo-header.png" width="875" height="136" alt="">
    <div class="pl-track"></div>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
